name: PoE 前十筆物品價格檢查

on:
  repository_dispatch:
    types: [poe_price_check]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: poe-price-check
  cancel-in-progress: false

jobs:
  check-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Compare top 10 prices and notify Discord
        run: node poe-tracker/check.mjs
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}

      - name: Save price baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add poe-tracker/state.json
          if git diff --cached --quiet; then
            echo "Price state unchanged."
          else
            git commit -m "Update PoE price snapshot [skip ci]"
            git push
          fi
